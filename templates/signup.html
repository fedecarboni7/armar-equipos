    <meta charset="UTF-8">

    <style>
      .gsi-material-button {
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        -webkit-appearance: none;
        background-color: #f2f2f2;
        background-image: none;
        border: none;
        -webkit-border-radius: 4px;
        border-radius: 4px;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        color: #1f1f1f;
        cursor: pointer;
        font-family: 'Roboto', arial, sans-serif;
        font-size: 14px;
        height: 40px;
        letter-spacing: 0.25px;
        outline: none;
        overflow: hidden;
        padding: 0 12px;
        position: relative;
        text-align: center;
        -webkit-transition: background-color .218s, border-color .218s, box-shadow .218s;
        transition: background-color .218s, border-color .218s, box-shadow .218s;
        vertical-align: middle;
        white-space: nowrap;
        width: 100%;
        max-width: 400px;
        min-width: min-content;
      }

      .gsi-material-button .gsi-material-button-icon {
        height: 20px;
        margin-right: 10px;
        min-width: 20px;
        width: 20px;
      }

      .gsi-material-button .gsi-material-button-content-wrapper {
        -webkit-align-items: center;
        align-items: center;
        display: flex;
        -webkit-flex-direction: row;
        flex-direction: row;
        -webkit-flex-wrap: nowrap;
        flex-wrap: nowrap;
        height: 100%;
        justify-content: space-between;
        position: relative;
        width: 100%;
      }

      .gsi-material-button .gsi-material-button-contents {
        -webkit-flex-grow: 1;
        flex-grow: 1;
        font-family: 'Roboto', arial, sans-serif;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: top;
      }

      .gsi-material-button .gsi-material-button-state {
        -webkit-transition: opacity .218s;
        transition: opacity .218s;
        bottom: 0;
        left: 0;
        opacity: 0;
        position: absolute;
        right: 0;
        top: 0;
      }

      .gsi-material-button:disabled {
        cursor: default;
        background-color: #ffffff61;
      }

      .gsi-material-button:disabled .gsi-material-button-state {
        background-color: #1f1f1f1f;
      }

      .gsi-material-button:disabled .gsi-material-button-contents {
        opacity: 38%;
      }

      .gsi-material-button:disabled .gsi-material-button-icon {
        opacity: 38%;
      }

      .gsi-material-button:not(:disabled):active .gsi-material-button-state,
      .gsi-material-button:not(:disabled):focus .gsi-material-button-state {
        background-color: #001d35;
        opacity: 12%;
      }

      .gsi-material-button:not(:disabled):hover {
        -webkit-box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15);
        box-shadow: 0 1px 2px 0 rgba(60, 64, 67, .30), 0 1px 3px 1px rgba(60, 64, 67, .15);
      }

      .gsi-material-button:not(:disabled):hover .gsi-material-button-state {
        background-color: #001d35;
        opacity: 8%;
      }
    </style>
  </head>
  <body class="justify-center flex h-screen items-center">
    <div
      class="card bg-neutral text-neutral-content sm:w-96 w-full max-w-96 h-fit m-4">
      <div class="p-4 rounded-lg shadow-md border-primary">
        <h1 class="text-2xl font-bold text-center">Crear cuenta</h1>
        <br/>
        {% if error %}
          <div class="bg-red-500 text-white p-2 rounded mb-4">
              {{ error }}
          </div>
        {% endif %}
        
        {% if success %}
        <div class="bg-green-500 text-white p-2 rounded mb-4">
            {{ success }}
        </div>
        {% endif %}
        <form action="/signup" method="POST" class="mt-4 flex flex-col gap-2">          <label
            class="input input-bordered flex items-center gap-2"
            for="username">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="h-4 w-4 opacity-70">
              <path
                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" />
            </svg>
            <input
              type="text"
              class="grow"
              name="username"
              placeholder="Usuario"
              autocapitalize="off"
              autocomplete="username"
              required />
          </label>
          <label
            class="input input-bordered flex items-center gap-2"
            for="email">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="h-4 w-4 opacity-70">
              <path
                d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" />
              <path
                d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" />
            </svg>
            <input
              type="email"
              class="grow"
              name="email"
              placeholder="Correo electrónico"
              autocomplete="email"
              required />
          </label>
          <label
            class="input input-bordered flex items-center gap-2"
            for="password">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 16 16"
              fill="currentColor"
              class="h-4 w-4 opacity-70">
              <path
                fill-rule="evenodd"
                d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
                clip-rule="evenodd" />
            </svg>
            <input
              type="password"
              id="password-input"
              class="grow"
              placeholder="Contraseña"
              name="password"
              autocomplete="new-password"
              required />
            <button
              type="button"
              onclick="togglePasswordVisibility('password-input', 'eye-icon')"
              class="opacity-70 hover:opacity-100 cursor-pointer bg-transparent border-0">
              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-4 w-4">
                <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" />
                <path fill-rule="evenodd" d="M1.38 8.28a.87.87 0 0 1 0-.566 7.003 7.003 0 0 1 13.238.006.87.87 0 0 1 0 .566A7.003 7.003 0 0 1 1.379 8.28ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" clip-rule="evenodd" />
              </svg>
            </button>
          </label>
          <ul class="text-sm list-disc pl-5 mt-2" id="password-requirements">
            <li id="length-requirement" class="text-gray-600">Al menos 8 caracteres</li>
            <li id="uppercase-requirement" class="text-gray-600">Una letra mayúscula</li>
            <li id="lowercase-requirement" class="text-gray-600">Una letra minúscula</li>
            <li id="number-requirement" class="text-gray-600">Un número</li>
            <li id="special-char-requirement" class="text-gray-600 hidden">Un carácter especial (si tiene menos de 12 caracteres)</li>
          </ul>
          <br />
          <button type="submit" class="btn btn-primary w-full">Crear</button>
        </form>
        <div class="divider">o</div>
        <button class="gsi-material-button" type="button" onclick="window.location.href='/auth/google/login'">
          <div class="gsi-material-button-state"></div>
          <div class="gsi-material-button-content-wrapper">
            <div class="gsi-material-button-icon">
              <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
              </svg>
            </div>
            <span class="gsi-material-button-contents">Continuar con Google</span>
            <span style="display: none;">Continuar con Google</span>
          </div>
        </button>
        <!-- Login link -->
        <div class="mt-4 text-center">
          <a href="/login" class="link link-primary" style="text-decoration-line: none;">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </body>
  <script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M3.28 2.22a.75.75 0 0 0-1.06 1.06l10.5 10.5a.75.75 0 1 0 1.06-1.06l-1.322-1.323a7.012 7.012 0 0 0 2.16-3.11.87.87 0 0 0 0-.567A7.003 7.003 0 0 0 4.82 3.76l-1.54-1.54Zm3.44 3.44A3.002 3.002 0 0 1 10.15 9.09l-3.43-3.43Z"/><path d="M7.188 2.5c.346 0 .687.028 1.023.082l-1.19 1.19a3 3 0 0 0-3.94 3.94L2.06 8.733a7.017 7.017 0 0 1-.44-.962.87.87 0 0 1 0-.566A7.003 7.003 0 0 1 7.188 2.5Z"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path fill-rule="evenodd" d="M1.38 8.28a.87.87 0 0 1 0-.566 7.003 7.003 0 0 1 13.238.006.87.87 0 0 1 0 .566A7.003 7.003 0 0 1 1.379 8.28ZM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" clip-rule="evenodd"/>';
      }
    }

    const passwordInput = document.querySelector('input[name="password"]');
    const submitButton = document.querySelector('button[type="submit"]');
    const lengthReq = document.getElementById('length-requirement');
    const uppercaseReq = document.getElementById('uppercase-requirement');
    const lowercaseReq = document.getElementById('lowercase-requirement');
    const numberReq = document.getElementById('number-requirement');
    const specialCharReq = document.getElementById('special-char-requirement');
  
    passwordInput.addEventListener('input', function () {
      const password = passwordInput.value;
      const minLength = password.length >= 8;
      const hasUppercase = /[A-Z]/.test(password);
      const hasLowercase = /[a-z]/.test(password);
      const hasNumber = /\d/.test(password);
      const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
  
      lengthReq.classList.toggle('text-green-600', minLength);
      lengthReq.classList.toggle('text-gray-600', !minLength);
  
      uppercaseReq.classList.toggle('text-green-600', hasUppercase);
      uppercaseReq.classList.toggle('text-gray-600', !hasUppercase);
  
      lowercaseReq.classList.toggle('text-green-600', hasLowercase);
      lowercaseReq.classList.toggle('text-gray-600', !hasLowercase);
  
      numberReq.classList.toggle('text-green-600', hasNumber);
      numberReq.classList.toggle('text-gray-600', !hasNumber);
  
      const specialCharRequired = password.length < 12;
      specialCharReq.classList.toggle('hidden', !specialCharRequired);
      specialCharReq.classList.toggle('text-green-600', hasSpecialChar && specialCharRequired);
      specialCharReq.classList.toggle('text-gray-600', !(hasSpecialChar && specialCharRequired));
  
      let valid = minLength && hasUppercase && hasLowercase && hasNumber;
  
      if (specialCharRequired) {
        valid = valid && hasSpecialChar;
      }
  
      submitButton.disabled = !valid;
    });
  </script>  
</html>
