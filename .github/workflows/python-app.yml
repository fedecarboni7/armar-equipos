# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        uv sync --frozen
    - name: Check formatting with ruff
      run: |
        uv run ruff format --check .
    - name: Lint with ruff
      run: |
        uv run ruff check .

  test:

    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: armar_equipos_user
          POSTGRES_PASSWORD: armar_equipos_pass
          POSTGRES_DB: armar_equipos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armar_equipos_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://armar_equipos_user:armar_equipos_pass@localhost:5432/armar_equipos_test
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      CRON_SECRET_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        uv sync --frozen
    - name: Run migrations
      run: |
        uv run alembic upgrade head
    - name: Test with pytest
      run: |
        uv run pytest -v -m "not brevo"
